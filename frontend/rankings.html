<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ExoHabit AI — Rankings</title>
  <link rel="icon" href="favicon_exohabitai.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rankings.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="brand" onclick="location.href='index.html'">
    <img src="favicon_exohabitai.png" class="logo" alt="ExoHabit AI">
    <span class="brand-text">ExoHabit AI</span>
  </div>

  <div class="nav-links">
    <a href="index.html">HOME</a>
    <a href="add_planet.html">ADD PLANET</a>
    <a href="predict.html">PREDICT HABITABILITY</a>
    <a href="rankings.html" class="active">VIEW RANKINGS</a>
  </div>
</nav>

<!-- ================= HERO ================= -->
<section class="hero rankings-hero">

  <!-- background planets stay -->
  <div class="space-object planet planet-1"></div>
  <div class="space-object planet planet-2"></div>
  <div class="space-object planet planet-3"></div>

  <div class="rankings-container">

    <!-- Header -->
    <div class="rankings-header">
      <div>
        <h1>Habitability Rankings</h1>
        <p>Ranked exoplanets based on predicted habitability probability.</p>
      </div>

      <div class="rankings-controls">
        <label>Show</label>
        <select id="limitSelect" class="ranking-select">
          <option value="10">Top 10</option>
          <option value="15">Top 15</option>
          <option value="25">Top 25</option>
          <option value="50">Top 50</option>
          <option value="all">All</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="rankings-table-wrapper">
      <table class="rankings-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Planet Name</th>
            <th>Habitability Probability</th>
          </tr>
        </thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>

    <!-- Error -->
    <div id="error" class="ranking-error hidden"></div>

  </div>
</section>

<!-- ================= SCRIPT ================= -->
<script>
const BASE_URL = "http://127.0.0.1:5000";

const rankingBody = document.getElementById("rankingBody");
const limitSelect = document.getElementById("limitSelect");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");

let rankingData = [];

/* ========= FETCH RANKINGS ========= */
async function fetchRankings() {
  loading.classList.remove("hidden");
  errorBox.classList.add("hidden");
  rankingBody.innerHTML = "";

  try {
    const res = await fetch(`${BASE_URL}/rank`);
    const result = await res.json();

    if (result.status !== "success") {
      throw new Error(result.message);
    }

    rankingData = result.data;
    renderTable();

  } catch (err) {
    errorBox.innerHTML = `<p class="error">❌ ${err.message}</p>`;
    errorBox.classList.remove("hidden");
  } finally {
    loading.classList.add("hidden");
  }
}

/* ========= RENDER TABLE ========= */
function renderTable() {
  const limit = limitSelect.value;
  const dataToShow =
    limit === "all" ? rankingData : rankingData.slice(0, Number(limit));

  rankingBody.innerHTML = "";

  if (dataToShow.length === 0) {
    rankingBody.innerHTML = `
      <tr>
        <td colspan="3" style="text-align:center; opacity:0.7;">
          No ranked planets available
        </td>
      </tr>
    `;
    return;
  }

  dataToShow.forEach((planet) => {
    const probPercent = Math.round(planet.habitability_probability * 100);

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${planet.rank}</td>
      <td>${planet.planet_name}</td>
      <td>
        <div class="probability-cell">
          <div class="prob-bar">
            <div style="width:${probPercent}%"></div>
          </div>
          <span>${probPercent}%</span>
        </div>
      </td>
    `;
    rankingBody.appendChild(row);
  });
}

/* ========= EVENTS ========= */
limitSelect.addEventListener("change", renderTable);

/* ========= INIT ========= */
fetchRankings();
</script>

</body>
</html>
