[pytest]
# Run from backend/ directory
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output by default with short traceback
addopts = -v --tb=short

# Show markers in --markers output
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

# Logging config — show warnings during tests
log_cli = false
log_cli_level = WARNING

[coverage:run]
source = .
omit =
    tests/*
    .venv/*
    __pycache__/*
    instance/*

[coverage:report]
show_missing = true
fail_under = 0
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
